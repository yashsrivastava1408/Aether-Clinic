name: AI Doctor CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  client-checks:
    name: Client - Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type Check
        run: npx tsc --noEmit

  server-checks:
    name: Server - Test & Schema Guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Start Server Check
        env:
          MONGO_URI: mongodb://localhost:27017/test_db
        run: |
          # Start server in background, wait 5s, check if it's still running
          timeout 10s npm run dev &
          PID=$!
          sleep 5
          if ps -p $PID > /dev/null; then
            echo "✅ Server started successfully"
            kill $PID
          else
            echo "❌ Server failed to start"
            exit 1
          fi
