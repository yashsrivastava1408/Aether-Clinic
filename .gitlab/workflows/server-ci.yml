server-test:
  stage: test
  image: node:20
  services:
    - mongo:latest
  variables:
    MONGO_URI: mongodb://mongo:27017/test_db
  script:
    - cd server
    - npm ci
    - |
      timeout 10s npm run dev &
      PID=$!
      sleep 5
      if ps -p $PID > /dev/null; then
        echo "✅ Server started successfully"
        kill $PID
      else
        echo "❌ Server failed to start"
        exit 1
      fi
  only:
    refs:
      - branches
      - merge_requests
    changes:
      - "server/**/*"

server-schema-guard:
  stage: schema-check
  image: alpine/git
  script:
    - |
      echo "Checking for unauthorized schema changes..."
      # Check if any file in server/models/ has been modified in the last commit
      if git diff --name-only HEAD^ HEAD | grep 'server/models/'; then
        echo "❌ CRITICAL: Unauthorized Schema Change Detected in server/models/!"
        echo "Schema changes are forbidden in this pipeline."
        exit 1
      else
        echo "✅ No schema changes detected."
      fi
  only:
    refs:
      - branches
      - merge_requests
    changes:
      - "server/**/*"
