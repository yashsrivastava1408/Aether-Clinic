version: '3.8'

services:
  # DATABASE: Locally hosted MongoDB
  mongodb:
    image: mongo:latest
    container_name: aether-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - aether-network
    restart: always

  # VECTOR DB: Qdrant for Distributed RAG
  qdrant:
    image: qdrant/qdrant:v1.16.1
    container_name: aether-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - aether-network
    restart: always

  # ML SERVICE: Multi-Agent RAG Hub (Python)
  ml-service:
    build:
      context: ./ml
    container_name: aether-ml-service
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Conversation state (encrypted with the same key the backend uses)
      - MONGO_URI=mongodb://mongodb:27017/ai_doctor_db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # LLM providers: local Ollama on the host first, then hosted fallbacks
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Clinician review before release: off | urgent | all
      - REVIEW_MODE=${REVIEW_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - feedback-data:/app/shared # Shared volume for Flywheel logs
    networks:
      - aether-network
    depends_on:
      - qdrant
      - mongodb
    restart: always

  # BACKEND: Node.js API Gateway
  backend-service:
    build:
      context: ./server
    container_name: aether-backend
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/ai_doctor_db
      - ML_BASE_URL=http://ml-service:5001
      - INTELLIGENCE_BASE_URL=http://ml-service:5001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Link target for check-in emails, and the key for the clinician review queue
      - APP_URL=http://${PUBLIC_IP:-localhost}
      - REVIEWER_KEY=${REVIEWER_KEY:-}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      - mongodb
      - ml-service
      - qdrant
    networks:
      - aether-network
    volumes:
      - feedback-data:/app/shared
    restart: always

  # FRONTEND: React Web Client (Nginx)
  frontend:
    build:
      context: ./client
      args:
        - VITE_API_URL=http://${PUBLIC_IP}:5050
    container_name: aether-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-service
    networks:
      - aether-network
    restart: always

networks:
  aether-network:
    driver: bridge

volumes:
  mongo-data:
  feedback-data:
  qdrant-data:
