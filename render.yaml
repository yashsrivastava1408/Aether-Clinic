services:
  # 🧠 Python ML Service
  - type: web
    name: aether-ml-service
    env: python
    buildCommand: cd ml && pip install -r requirements.txt
    startCommand: cd ml && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        sync: false

  # 🚀 Node.js Backend API Gateway
  - type: web
    name: aether-backend
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ML_BASE_URL
        fromService:
          type: web
          name: aether-ml-service
          property: hostport
