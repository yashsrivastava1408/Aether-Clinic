apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aether-client
  template:
    metadata:
      labels:
        app: aether-client
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: client
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/aether-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
spec:
  selector:
    app: aether-client
  ports:
    - port: 80
      targetPort: 80
