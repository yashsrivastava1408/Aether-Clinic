apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aether-ml
  template:
    metadata:
      labels:
        app: aether-ml
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: ml-risk-engine
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/aether-ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: QDRANT_HOST
              value: "qdrant"
            - name: QDRANT_PORT
              value: "6333"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-credentials
                  key: password
            # Conversation state, shared by all replicas and AES-encrypted
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@mongodb:27017/ai_doctor_db?authSource=admin"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: aether-secrets
                  key: encryption-key
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aether-secrets
                  key: gemini-api-key
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aether-secrets
                  key: groq-api-key
                  optional: true
          volumeMounts:
            - name: shared-feedback
              mountPath: /app/shared
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: shared-feedback
          hostPath:
            path: /var/lib/aether/shared
            type: DirectoryOrCreate