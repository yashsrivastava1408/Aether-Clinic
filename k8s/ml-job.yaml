apiVersion: batch/v1
kind: Job
metadata:
  name: aether-ml-job
spec:
  backoffLimit: 1
  template:
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: ml-risk-engine
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/aether-ml-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Never
